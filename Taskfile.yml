version: '3'

tasks:
  cluster:up:
    desc: Create the k3d cluster and install Flux
    cmds:
      - ./scripts/cluster-up.sh

  akp:up:
    desc: Provision a dedicated Akuity Platform instance and register the k3d cluster
    cmds:
      - ./scripts/akp-up.sh

  deploy:flux:
    desc: Deploy the guestbook chart via a Flux HelmRelease
    cmds:
      - ./scripts/deploy-flux.sh

  verify:start:
    desc: Start the background availability/stability probe
    cmds:
      - ./scripts/verify-start.sh

  verify:report:
    desc: Stop the probe and print a pass/fail summary
    cmds:
      - ./scripts/verify-report.sh

  verify:watch:
    desc: Live-watch pods, Flux HelmRelease, ArgoCD Application, and probe logs (run in a second terminal)
    cmds:
      - ./scripts/verify-watch.sh

  migrate:
    desc: Cut the guestbook over from Flux to the Akuity-hosted ArgoCD Application
    cmds:
      - ./scripts/migrate.sh

  cleanup:flux:
    desc: Remove the suspended Flux objects and orphaned Helm release secret
    cmds:
      - ./scripts/cleanup-flux.sh

  down:
    desc: Tear down the k3d cluster and destroy the AKP instance
    cmds:
      - ./scripts/teardown.sh

  adminapp:deploy-flux:
    desc: Deploy the adminapp-helmfirst chart via a Flux HelmRelease
    cmds:
      - ./scripts/adminapp-deploy-flux.sh

  adminapp:break:
    desc: Adopt adminapp under ArgoCD and reproduce the lookup/hooks pitfalls
    cmds:
      - ./scripts/adminapp-break.sh

  adminapp:fix:
    desc: Repoint the ArgoCD Application at the refactored chart and prove both pitfalls are fixed
    cmds:
      - ./scripts/adminapp-fix.sh

  adminapp:vendored:
    desc: Deploy the vendored-widget chart via a Kustomize overlay and show the hook annotation rewrite
    cmds:
      - ./scripts/adminapp-vendored.sh

  adminapp:cleanup:
    desc: Remove all adminapp/vendored-widget Flux and ArgoCD objects
    cmds:
      - ./scripts/adminapp-cleanup.sh
