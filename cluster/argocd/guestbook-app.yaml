apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adamancini/flux-to-argo
    targetRevision: main
    path: chart/guestbook
  destination:
    name: flux-to-argo
    namespace: guestbook-demo
  syncPolicy: {}
