apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vendored-widget
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adamancini/flux-to-argo
    targetRevision: main
    path: chart/vendored-widget-kustomize
  destination:
    name: flux-to-argo
    namespace: adminapp-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
